apiVersion: apps/v1
kind: Deployment
metadata: 
  name: director-deployment
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: director
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: director
    spec:
      serviceAccountName: director-service-account
      containers:
        - name: director
          image: mikej091/director:1.0.0-SNAPSHOT
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
